name: Build mod jar

# Builds the Fabric mod jar on every push / pull request and stores it as a
# downloadable artifact. You can also run it manually from the Actions tab
# (workflow_dispatch) and grab the jar from the run summary afterwards.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          set +e
          ./gradlew build --stacktrace 2>&1 | tee build-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo '## Gradle build failed - relevant output'
              echo '```text'
              grep -E "error:|warning:|FAILED|What went wrong|Execution failed|Caused by|\.java" build-output.txt | head -150
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      # Temporary diagnostics: publish the tail of a failed build as an issue
      # so the log can be inspected where raw run logs are unavailable.
      - name: Report failed build log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Gradle build failed (run $GITHUB_RUN_ID, commit $GITHUB_SHA)"
            echo '```text'
            grep -E "\.java:[0-9]+:|error:|What went wrong|Execution failed|> Compilation failed" build-output.txt | head -120
            echo '--- tail ---'
            tail -40 build-output.txt
            echo '```'
          } > build-report.md
          gh issue create --title "CI build log for run $GITHUB_RUN_ID" --body-file build-report.md || true

      - name: Show built jars
        run: ls -la build/libs

      # The file you want in-game is the remapped jar:
      #   realworld-1.0.0.jar        <-- put this in your mods folder
      # (the -dev and -sources jars are for developers only)
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: RealWorld-mod-jar
          path: build/libs/*.jar
          retention-days: 90
          if-no-files-found: error
